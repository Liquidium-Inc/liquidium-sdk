packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"

allowBuilds:
  '@reown/appkit': false
  bigint-buffer: false
  bufferutil: false
  core-js: false
  esbuild: true
  protobufjs: false
  sharp: true
  utf-8-validate: false

overrides:
  '@noble/hashes': ^1.8.0
  '@dynamic-labs-wallet/primitives': 0.0.337
  "proxy-addr@<2.0.8": 2.0.8
  "shell-quote@<1.11.0": 1.11.0
  "tinypool@<2.1.2": 2.1.2
