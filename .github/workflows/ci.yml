name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: ".nvmrc"
          version: "1.5.0"
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile

      - run: vp run build

      - run: vp check

      - run: vp run typecheck

      - run: vp run test

      - run: vp run --filter @liquidium/example-recovery-flow test

      - run: vp run --filter @liquidium/example-liquidation-flow test
